<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Projects</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='10' fill='none' stroke='%23c0432a' stroke-width='2.5'/><circle cx='16' cy='16' r='3' fill='%23c0432a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Pirata+One&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0a0906;
    --ink:#232323;
    --accent:#dcdcdc;
    --parchment:#e8e2d0;
    --line: rgba(220, 220, 220, 0.35);
  }
  body {
    background:var(--ink); color:var(--parchment);
    font-family:"Pirata One", serif;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; height:100vh; margin:0;
  }
  h1 {
    font-family:"Pirata One", serif; font-weight:400;
    font-size:clamp(32px,5vw,52px); margin:0 0 20px;
    color:var(--accent); letter-spacing:0.08em;
    animation: titlePulse 3.5s ease-in-out infinite;
  }

  @keyframes titlePulse {
    0%, 100% {
      text-shadow: 0 0 16px rgba(220, 220, 220, 0.35), 0 0 2px rgba(220, 220, 220, 0.7);
    }
    50% {
      text-shadow: 0 0 30px rgba(220, 220, 220, 0.65), 0 0 3px rgba(220, 220, 220, 0.9);
    }
  }
  a {
    font-family:"VT323"; color:var(--parchment); font-size:1.4rem; margin:1rem;
    text-decoration:none; border:1px solid var(--line);
    padding:0.6rem 1.4rem; border-radius:2px;
    transition:all .25s ease;
  }
  #bg { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  h1, a { position:relative; z-index:1; }
  a:hover {
    background:rgba(220,220,220,0.12); border-color:var(--accent);
    color:var(--accent);
  }
</style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <h1>Projects</h1>
  <a href="Athanor.html">Athanor Beats</a>
  <a href="visualizer.html">Great Work Visualizer</a>
  <a href="tuner.html">Alchemy Tuner</a>
  <a href="ChaldeanNumerology.html">Chaldean Numerology</a>
  <a href="resolve-converter.html">Third Eye Converter</a>
<script>
/* Background: a slow starfield with speed streaks, tinted with the seven chakra colours. Respects reduced motion. */
(() => {
  const cv = document.getElementById('bg'), g = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // root, sacral, solar plexus, heart, throat, third eye, crown
  const CHAKRA = ['214,40,40', '242,121,45', '244,208,63', '76,175,80', '33,150,243', '92,107,192', '186,104,200'];
  const WHITE = '220,220,220';
  const STREAK = 1;                 // streak length multiplier (0 turns streaks off)
  const SEG = [.55, .28, .1];       // brightness of the three streak segments, head to tail
  let W, H, dpr, stars = [], px = 0, py = 0, tx = 0, ty = 0, last = 0;

  const spawn = (st, anywhere) => {
    st.x = (Math.random() - .5) * W * 1.1;
    st.y = (Math.random() - .5) * H * 1.1;
    st.z = anywhere ? .08 + Math.random() * .92 : 1;
    return st;
  };
  function seed() {
    const n = Math.max(90, Math.min(260, Math.round(W * H / 6500)));
    stars = Array.from({ length: n }, () => spawn({
      v: .018 + Math.random() * .02,
      c: Math.random() < .2 ? WHITE : CHAKRA[Math.floor(Math.random() * CHAKRA.length)],
      tw: .4 + Math.random() * 1.2, ph: Math.random() * 6.28
    }, true));
  }
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    seed();
    if (reduce) frame(0);
  }
  function frame(ts) {
    const t = ts / 1000, dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    px += (tx - px) * .04; py += (ty - py) * .04;
    const cx = W / 2 + px * 40, cy = H / 2 + py * 40;
    const a = t * .006, ca = Math.cos(a), sa = Math.sin(a);
    for (const st of stars) {
      if (!reduce) st.z -= st.v * dt;
      const x = st.x * ca - st.y * sa, y = st.x * sa + st.y * ca;
      const sx = cx + x / st.z, sy = cy + y / st.z;
      if (st.z < .04 || sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) { spawn(st, false); continue; }
      const near = 1 - st.z;
      const fade = Math.min(1, near / .08);
      const twinkle = .75 + .25 * Math.sin(t * st.tw + st.ph);
      const al = (.18 + near * .8) * fade * twinkle;
      const r = .5 + near * 1.9;
      if (!reduce && STREAK > 0 && near > .12) {
        const ddx = sx - cx, ddy = sy - cy, dist = Math.hypot(ddx, ddy);
        if (dist > 1) {
          const L = Math.min(dist, dist * (.025 + near * .16) * STREAK), ux = ddx / dist, uy = ddy / dist;
          g.lineWidth = Math.max(.6, r * 1.1); g.lineCap = 'round';
          for (let i = 0; i < 3; i++) {
            g.strokeStyle = 'rgba(' + st.c + ',' + (al * SEG[i]).toFixed(3) + ')';
            g.beginPath();
            g.moveTo(sx - ux * L * i / 3, sy - uy * L * i / 3);
            g.lineTo(sx - ux * L * (i + 1) / 3, sy - uy * L * (i + 1) / 3);
            g.stroke();
          }
        }
      }
      g.fillStyle = 'rgba(' + st.c + ',' + al.toFixed(3) + ')';
      g.beginPath(); g.arc(sx, sy, r, 0, Math.PI * 2); g.fill();
      if (near > .55) {
        g.fillStyle = 'rgba(' + st.c + ',' + (al * .16).toFixed(3) + ')';
        g.beginPath(); g.arc(sx, sy, r * 3.4, 0, Math.PI * 2); g.fill();
      }
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  addEventListener('resize', resize);
  if (!reduce) addEventListener('pointermove', e => { tx = e.clientX / W - .5; ty = e.clientY / H - .5; });
  resize();
  if (!reduce) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
